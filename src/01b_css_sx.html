<style>
/* ================= Cortex Scribe: brand, intro, sections (46_brand.js, 47_sections.js) ================= */
:root{--brand2:#A8585C;--c-blue:#2D6CDF;--c-blue-soft:#E3ECFC;--c-violet:#6B4FD8;--c-violet-soft:#ECE7FF;--c-teal:#13857D;--c-teal-soft:#DDF2F0;--c-amber:#A86200;--c-amber-soft:#FDF0D5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brand2:#D8A9AB;--c-blue:#6EA8FF;--c-blue-soft:#162540;--c-violet:#A996FF;--c-violet-soft:#2A2345;--c-teal:#4CBDB4;--c-teal-soft:#173230;--c-amber:#F2B860;--c-amber-soft:#3A2C14}}
:root[data-theme="dark"],:root[data-theme="navy"]{--brand2:#D8A9AB;--c-blue:#6EA8FF;--c-blue-soft:#162540;--c-violet:#A996FF;--c-violet-soft:#2A2345;--c-teal:#4CBDB4;--c-teal-soft:#173230;--c-amber:#F2B860;--c-amber-soft:#3A2C14}

/* ---------- logo in the sidebar ---------- */
.brand{font:600 20px/1 "Poppins",var(--ff-d);letter-spacing:-.01em;gap:9px}
.brand-logo{width:30px;height:30px;object-fit:contain;flex:none;user-select:none}
.brand em{font-style:normal;color:var(--brand2)}

/* ---------- intro: the mark draws in from the nib, then the name and the tagline ---------- */
.intro{position:fixed;inset:0;z-index:100000;background:#0B0B0D;display:grid;place-items:center;overflow:hidden;cursor:pointer;transition:opacity .6s ease,transform .6s ease;color:#fff}
.intro.out{opacity:0;transform:scale(1.03);pointer-events:none}
.intro.out.fast{transition-duration:.22s}
.intro-row{display:flex;align-items:center;gap:34px;padding:24px}
.intro-mark{position:relative;width:150px;height:140px;flex:none}
.intro-logo{position:relative;width:100%;height:100%;object-fit:contain;clip-path:circle(0% at 80% 78%);animation:introMark 1s cubic-bezier(.2,.7,.2,1) .15s forwards;filter:drop-shadow(0 6px 26px rgba(229,56,59,.35))}
.intro-glow{position:absolute;inset:-45%;background:radial-gradient(circle closest-side at 52% 56%,rgba(229,56,59,.5),rgba(229,56,59,.18) 45%,rgba(229,56,59,0));opacity:0;animation:introGlow 2.2s ease .1s forwards}
.intro-mark::after{content:"";position:absolute;left:80%;top:78%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;box-shadow:0 0 18px 6px rgba(255,90,80,.9);opacity:0;animation:introSpark .7s ease-out .05s forwards}
.intro-line{width:2px;height:0;background:#3A3A40;border-radius:2px;flex:none;animation:introLine .5s ease .62s forwards}
.intro-words{display:flex;flex-direction:column;gap:14px}
.intro-name{font:500 64px/1 "Poppins",var(--ff-d);letter-spacing:-.01em;white-space:nowrap}
.intro-name .w2{color:#E2B1B3;margin-left:.26em}
.intro-name .il{display:inline-block;opacity:0;transform:translateY(16px);animation:introLetter .55s cubic-bezier(.2,.7,.2,1) forwards}
.intro-tag{font:500 15px/1 "Poppins",var(--ff);letter-spacing:.42em;color:#A6A6AF;opacity:0;white-space:nowrap;clip-path:inset(0 100% 0 0);animation:introTag .8s cubic-bezier(.3,.6,.2,1) 1.35s forwards}
.intro-tag i{font-style:normal;margin:0 .45em 0 .05em;color:#E5383B}
@keyframes introMark{0%{clip-path:circle(0% at 80% 78%);transform:scale(.92) rotate(-4deg)}100%{clip-path:circle(150% at 80% 78%);transform:none}}
@keyframes introGlow{0%{opacity:0;transform:scale(.6)}35%{opacity:1}100%{opacity:.35;transform:scale(1)}}
@keyframes introSpark{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(.6)}}
@keyframes introLine{to{height:118px}}
@keyframes introLetter{to{opacity:1;transform:none}}
@keyframes introTag{to{opacity:1;clip-path:inset(0 0 0 0)}}
.intro.quiet .intro-logo{clip-path:none}
.intro.quiet .intro-line{height:118px}
.intro.quiet .il,.intro.quiet .intro-tag{opacity:1;transform:none}
.intro.quiet .intro-tag{clip-path:none}
@media (max-width:700px){
  .intro-row{flex-direction:column;gap:20px;text-align:center}
  .intro-mark{width:112px;height:104px}
  .intro-line{width:0;height:2px;animation-name:introLineH}
  .intro.quiet .intro-line{width:90px;height:2px}
  .intro-words{align-items:center}
  .intro-name{font-size:40px}
  .intro-tag{font-size:11px}
}
@keyframes introLineH{to{width:90px}}

/* ---------- section list in the sidebar ---------- */
.secnav{display:flex;flex-direction:column;gap:1px;padding:0 8px 8px}
.secnav-item{display:flex;align-items:center;gap:10px;padding:6px 10px;border:0;background:none;border-radius:9px;color:var(--ink);font:600 14px/1.3 var(--ff);text-align:left;width:100%;cursor:pointer}
.secnav-item svg{width:18px;height:18px;color:var(--muted);flex:none}
.secnav-item:hover{background:var(--line-soft)}
.secnav-item[aria-current="page"]{background:var(--accent-soft)}
.secnav-item[aria-current="page"] svg{color:var(--accent)}
.secnav-new{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px;line-height:16px}

.side-foot.compact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px 4px;padding:6px 8px 8px}
.side-foot.compact>#aiBtn,.side-foot.compact>.store-note{grid-column:1 / -1}
.side-foot.compact .btn{padding:6px 8px;font-size:13.5px;min-width:0}
.side-foot.compact .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* ---------- a section replaces the page (the page stays loaded underneath) ---------- */
.main.in-sec>*:not(.topbar):not(.secview){display:none!important}
.main.in-sec .psearch,.main.in-sec .top-right>*:not(.status){display:none!important}
.app.in-sec{grid-template-columns:var(--sideW) minmax(0,1fr) 0px 0px}
.app.in-sec .panel,.app.in-sec .rail{display:none}
.app.in-sec .t-row.active{background:var(--line-soft)}
.secview{flex:1;min-height:0;overflow:auto;background:var(--paper);overscroll-behavior:contain}
.secview[hidden]{display:none}

.sx{padding:22px 28px 40px;display:flex;flex-direction:column;gap:16px;max-width:1480px;margin:0 auto;font-size:14px;line-height:1.45}
.sx .muted{color:var(--muted)}
.sx small{font-size:12px}
.sx-top{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.sx-hello{min-width:0;margin-right:auto}
.sx-hello h1{font:700 28px/1.1 var(--ff-d);margin:0;letter-spacing:-.02em}
.sx-hello p{margin:5px 0 0;color:var(--muted)}
.sx-preview{display:inline-block;font-size:11px;font-weight:700;line-height:1.5;color:var(--c-amber);background:var(--c-amber-soft);border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:1px;white-space:nowrap;cursor:help}
.sx-note{font-size:13px;color:var(--muted);margin-top:-6px}.sx-note .sx-preview{margin:0 6px 0 0}
.sx-link{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;padding:0;margin-left:4px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sx-capture{display:flex;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:0 12px;flex:1 1 220px;max-width:420px;height:40px;color:var(--muted);cursor:text}
.sx-capture:focus-within{border-color:var(--accent)}
.sx-capture svg{width:17px;height:17px;flex:none}
.sx-capture input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;outline:none;height:100%;padding:0}
.sx kbd{font:600 11px var(--ff);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
.sx-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:10px;padding:0 13px;height:40px;font:600 14px var(--ff);white-space:nowrap;cursor:pointer}
.sx-btn svg{width:17px;height:17px;flex:none}
.sx-btn:hover{border-color:var(--muted)}
.sx-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sx-btn.primary:hover{filter:brightness(1.08)}
.sx-btn.small{height:32px;padding:0 10px;font-size:13px;border-radius:9px}
.sx-row{display:flex;gap:8px;flex-wrap:wrap}
.sx-quick,.sx-tabbar{display:none}

.sx-card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.sx-card h3{display:flex;align-items:center;gap:8px;margin:0;font:700 14.5px/1.3 var(--ff)}
.sx-card p{margin:0}
.sx-card ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.sx-card.coach{background:linear-gradient(140deg,var(--accent-soft),var(--sheet) 72%);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.sx-more{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
button.sx-more{border:0;background:none;cursor:pointer;padding:2px 6px;border-radius:6px;font-family:var(--ff)}
button.sx-more:hover{color:var(--ink);background:var(--line-soft)}
.sx-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.sx-ic svg{width:16px;height:16px}
.sx-ic.big{width:44px;height:44px;border-radius:12px;align-self:center}.sx-ic.big svg{width:24px;height:24px}
.sx-ic.red{background:var(--accent-soft);color:var(--accent)}.sx-ic.blue{background:var(--c-blue-soft);color:var(--c-blue)}.sx-ic.green{background:var(--ok-soft);color:var(--ok)}
.sx-ic.violet{background:var(--c-violet-soft);color:var(--c-violet)}.sx-ic.amber{background:var(--c-amber-soft);color:var(--c-amber)}.sx-ic.teal{background:var(--c-teal-soft);color:var(--c-teal)}
.sx-chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--line-soft);color:var(--muted)}
.sx-chip.red{background:var(--accent-soft);color:var(--accent)}.sx-chip.blue{background:var(--c-blue-soft);color:var(--c-blue)}.sx-chip.green{background:var(--ok-soft);color:var(--ok)}
.sx-chip.violet{background:var(--c-violet-soft);color:var(--c-violet)}.sx-chip.amber{background:var(--c-amber-soft);color:var(--c-amber)}.sx-chip.teal{background:var(--c-teal-soft);color:var(--c-teal)}
.sx-track{height:7px;border-radius:99px;background:var(--line-soft);overflow:hidden;display:flex;flex:1;min-width:40px}
.sx-track i{display:block;height:100%;border-radius:99px;background:var(--accent);flex:none;transition:width .35s ease}
.sx-track.big{height:10px}
.sx-track.sx-segs{gap:2px}.sx-track.sx-segs i{border-radius:3px}
.sx-ev i.red,.sx-track i.red{background:var(--accent)}.sx-ev i.blue,.sx-track i.blue{background:var(--c-blue)}.sx-ev i.green,.sx-track i.green{background:var(--ok)}
.sx-ev i.violet,.sx-track i.violet{background:var(--c-violet)}.sx-ev i.amber,.sx-track i.amber{background:var(--c-amber)}.sx-ev i.teal,.sx-track i.teal{background:var(--c-teal)}
.sx .pc{margin-left:auto;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sx-ava{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font:700 10.5px/1 var(--ff);color:#141416;background:var(--c);flex:none;border:2px solid var(--sheet);box-sizing:content-box}
.sx-ava.big{width:32px;height:32px;font-size:12.5px}

/* Home */
.sx-grid.home{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:16px}
.sx-grid.home .today{grid-row:span 2}
.sx-grid.home .cont{grid-column:span 2}
.sx-ev{display:grid;grid-template-columns:46px 4px 1fr;gap:10px;align-items:stretch;padding:3px 0}
.sx-ev time{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:1px}
.sx-ev i{border-radius:3px;display:block}
.sx-ev b{display:block;font-size:13.5px}.sx-ev small{display:block;color:var(--muted)}
.sx-ev.now b::after{content:"now";margin-left:8px;font-size:10.5px;color:#fff;background:var(--accent);border-radius:999px;padding:1px 7px;vertical-align:1px}
.sx-task{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.sx-task:last-child{border-bottom:0}
.sx-box{width:17px;height:17px;border:1.8px solid var(--line);border-radius:5px;flex:none}.sx-box.on{background:var(--ok);border-color:var(--ok)}
.sx-task .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sx-task.done .tt{color:var(--muted);text-decoration:line-through}
.sx-due{font-size:12px;color:var(--muted);white-space:nowrap}.sx-due.soon{color:var(--c-amber);font-weight:700}
.sx-proj{display:flex;flex-direction:column;gap:5px}
.sx-proj .row{display:flex;align-items:center;gap:8px}.sx-proj b{font-size:13.5px}.sx-proj small{color:var(--muted)}
.sx-log{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.sx-log>span:nth-child(odd){color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px;white-space:nowrap}
.sx-log code{font:12px ui-monospace,Consolas,monospace;color:var(--c-teal);background:var(--c-teal-soft);border-radius:5px;padding:0 5px}
.sx-log small{display:block;color:var(--muted)}
.sx-log.big{gap:12px 16px;font-size:14px}
.sx-bars{display:flex;align-items:flex-end;gap:7px;height:56px}.sx-bars i{flex:1;border-radius:5px 5px 2px 2px;background:var(--c-teal)}.sx-bars i.off{background:var(--line)}
.sx-days{display:flex;gap:7px;font-size:10.5px;color:var(--muted);margin-top:-4px}.sx-days span{flex:1;text-align:center}
.sx-inbox{display:flex;flex-direction:column;gap:7px;font-size:13px}.sx-inbox div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sx-timer{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line-soft);padding-top:12px;margin-top:auto}
.sx-timer .ring{width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--accent) 0 100%,var(--line-soft) 0);display:grid;place-items:center;flex:none;position:relative}
.sx-timer .ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--sheet)}
.sx-timer .ring b{position:relative;font:700 15px var(--ff-d)}
.sx-timer small{display:block;color:var(--muted);font-size:12.5px}
.sx-thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sx-thumb{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);padding:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.sx-thumb:hover,.sx-thumb:focus-visible{border-color:var(--accent)}
.sx-thumb b{display:block;font-size:13px;padding:8px 10px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sx-thumb small{display:block;color:var(--muted);font-size:11.5px;padding:0 10px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sx-pv{height:66px;background:#fff repeating-linear-gradient(to bottom,transparent 0 13px,#e3e6ec 13px 14px);padding:13px 12px;display:flex;flex-direction:column;gap:9px}
.sx-pv i{display:block;height:5px;border-radius:3px;background:#c9ced6}.sx-pv i:first-child{background:#333}
.sx-pv.a4{background:#f6f6f7}
.sx-pv.brd{background:#111113 radial-gradient(#2b2b30 1.2px,transparent 1.4px) 0 0/14px 14px}.sx-pv.brd i{background:#3a3a40}.sx-pv.brd i:first-child{background:var(--accent)}

/* Word link (49_wordlink.js) */
.sx-word .wl-doc{display:flex;align-items:center;gap:10px}.sx-word .wl-doc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sx-word .wl-doc small{color:var(--muted)}
.sx-word .wl-doc>div{min-width:0;flex:1}
.sx-word .wl-doc+.wl-doc{border-top:1px solid var(--line-soft);padding-top:8px}
.wl-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-right:7px;flex:none;vertical-align:1px}.wl-dot.on{background:var(--ok)}
.sx-word code,.wl-code{font:12.5px ui-monospace,Consolas,monospace;background:var(--line-soft);border-radius:5px;padding:1px 5px;white-space:nowrap}
.wl-codein{width:118px;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font:600 15px ui-monospace,Consolas,monospace;letter-spacing:.15em;padding:0 10px}
.wl-codein:focus{outline:none;border-color:var(--accent)}
.wl-err{color:var(--accent);font-size:13px;font-weight:600}
.wl-pages{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;border-top:1px solid var(--line-soft);padding-top:8px;margin-top:auto}
.wl-pages .sx-link{margin:0;text-decoration:none}
.wl-steps{display:flex;flex-direction:column;gap:9px;padding-left:1.3em;margin:4px 0 10px}
.word-chip{display:inline-flex;align-items:center;gap:5px}.word-chip svg{width:14px;height:14px}
.word-chip.live{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.flow table.wtable{border-collapse:collapse;width:100%;margin:8px 0;table-layout:auto}
.flow table.wtable td{border:1px solid var(--muted);padding:4px 8px;vertical-align:top;min-width:36px;outline:none;overflow-wrap:anywhere;word-break:break-word}
.flow table.wtable td:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.wl-said{white-space:pre-wrap;font:12px ui-monospace,Consolas,monospace;background:var(--line-soft);border-radius:8px;padding:8px;margin:0;max-height:120px;overflow:auto}
.flow p.wlock{border:1.5px dashed var(--muted);border-radius:8px;padding:6px 10px;margin:6px 0;color:var(--muted);font-size:.88em;background:color-mix(in srgb,var(--line-soft) 60%,transparent);user-select:none;cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* AI editor (50_ai_edit.js) */
.ai-edit-line{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft);font-size:13px;font-weight:600;color:var(--ok)}
.ai-edit-line svg{width:15px;height:15px;flex:none}.ai-edit-line .btn{margin-left:auto}
.ai-edit-line.undone{color:var(--muted)}
.flow .ai-flash{animation:aiFlash 2.2s ease}
@keyframes aiFlash{0%,40%{background:color-mix(in srgb,var(--ok) 28%,transparent)}100%{background:transparent}}

/* Subjects & grades */
.sx-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sx-stat{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sx-stat small{color:var(--muted);font-weight:600}
.sx-stat b{font:700 26px/1.15 var(--ff-d);letter-spacing:-.01em}
.sx-stat b.mid{font-size:20px;line-height:1.5}
.sx-stat b em{font:700 12px var(--ff);font-style:normal;vertical-align:4px;margin-left:4px}
.sx-stat span{color:var(--muted);font-size:12px}
.sx-stat strong{color:var(--ink)}
.sx em.up,.sx .tr.up,.sx b.ok{color:var(--ok)}.sx em.down,.sx .tr.down{color:var(--accent)}.sx b.warn{color:var(--c-amber)}
.sx-subs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sx-sc{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.sx-sc:hover,.sx-sc:focus-visible{border-color:var(--accent)}
.sx-sc .row{display:flex;align-items:center;gap:8px}.sx-sc .row i{width:10px;height:10px;border-radius:3px;flex:none}.sx-sc .row b{font-size:15px}
.sx .tr{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}
.sx-sc .row2{display:flex;align-items:center;gap:12px}
.sx-sc .avg{font:700 30px/1 var(--ff-d)}.sx-sc .avg.lo{color:var(--accent)}
.sx-spark{height:40px;flex:1;min-width:0;max-width:170px}
.sx-sc small{color:var(--muted)}
.warnline{font-size:12px;font-weight:700;color:var(--c-amber)}
.sx-mates{display:flex;flex-direction:column;gap:12px}
.sx-mate{display:flex;align-items:center;gap:12px;min-width:0}
.sx-mate>div:not(.sx-track){width:220px;flex:none;min-width:0}
.sx-mate b{font-size:13.5px}.sx-mate small{display:block;color:var(--muted)}
.sx-mate .sx-spark{max-width:200px}
.sx-mate .pc{margin-left:0;width:70px;text-align:right}
.sx-mates>.sx-btn{align-self:flex-start}
.sx-mate.small{gap:10px}
.sx-mate.small b{width:52px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sx-mate.small small{width:100px;flex:none;display:block}
.sx-mate.small .pc{width:44px}
