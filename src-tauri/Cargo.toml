[package]
name = "inkling"
version = "0.1.0"
description = "Inkling study notebook"
edition = "2021"

[lib]
name = "inkling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
# the pad relay (src/padrelay.rs): a plain WebSocket, without encryption (no ring, so it builds on ARM laptops)
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

# AI requests (tauri-plugin-http). On Windows the encryption (TLS) comes from Windows itself (native-tls):
# the default (rustls with the ring library) needs the clang compiler on ARM computers (Snapdragon laptops).
[target.'cfg(windows)'.dependencies]
tauri-plugin-http = { version = "2", default-features = false, features = ["native-tls", "http2", "charset", "system-proxy", "cookies"] }

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-http = "2"

# Keeps the build folder (src-tauri/target) at about 2 GB instead of 5-6 GB: no debug information,
# which only matters when stepping through the Rust code in a debugger.
[profile.dev]
debug = 0
